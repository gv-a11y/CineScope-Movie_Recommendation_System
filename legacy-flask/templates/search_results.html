<!-- Client-side Template for Live Dropdown Search Results -->
<template id="search-result-template">
    <li class="search-result-item" tabindex="0">
        <div class="result-poster-wrapper">
            <!-- fallback poster via css if src is empty -->
            <img class="result-poster" src="" alt="Poster">
        </div>
        <div class="result-info">
            <span class="result-title"></span>
            <span class="result-year"></span>
        </div>
    </li>
</template>
